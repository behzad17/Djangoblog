<div class="container">
<div class="card mb-4 shadow-sm">
  <div class="card-body">
    <form method="get" role="search" aria-label="جست‌وجوی رویدادها">
      <div class="row g-3 align-items-end">
        <div class="col-md-4">
          <label for="event-q" class="form-label">جست‌وجوی رویدادها</label>
          <input type="search" name="q" id="event-q" value="{{ event_filters.q }}" maxlength="200"
          class="form-control" placeholder="عنوان، شهر یا نام محل برگزاری">
        </div>
        <div class="col-md-3">
          <label for="event-city" class="form-label">شهر</label>
          <input type="text" name="city" id="event-city" value="{{ event_filters.city }}" maxlength="120"
          class="form-control" placeholder="مثلاً گوتنبرگ یا Göteborg">
        </div>
        <div class="col-md-3">
          <label for="event-when" class="form-label">زمان</label>
          <select name="when" id="event-when" class="form-select">
            <option value="">رویدادهای پیش رو</option>
            <option value="week"{% if event_filters.when == 'week' %} selected{% endif %}>این هفته</option>
            <option value="month"{% if event_filters.when == 'month' %} selected{% endif %}>این ماه</option>
            <option value="archive"{% if event_filters.when == 'archive' %} selected{% endif %}>آرشیو</option>
          </select>
        </div>
        <div class="col-md-2">
          <button type="submit" class="btn btn-primary w-100">
            <i class="fas fa-search ms-2" aria-hidden="true"></i>جست‌وجو
          </button>
        </div>
      </div>
      {% if event_query %}<a class="btn btn-outline-secondary mt-3" href="{% url 'category_posts' category.slug %}">پاک کردن فیلترها</a>{% endif %}
    </form>
  </div>
</div>
</div>
