{% if community_stats %}
<section class="community-stats-section d-none d-md-block" aria-label="آمار جامعه پیوند">
  <div class="container">
    <ul class="community-stats-list">
      <li class="community-stats-item">
        <span class="community-stats-icon" aria-hidden="true">
          <i class="bi bi-newspaper"></i>
        </span>
        <span class="community-stats-text">
          <span class="community-stats-value">{{ community_stats.published_posts }}</span>
          <span class="community-stats-label">مطلب منتشر شده</span>
        </span>
      </li>
      <li class="community-stats-item">
        <span class="community-stats-icon" aria-hidden="true">
          <i class="bi bi-briefcase"></i>
        </span>
        <span class="community-stats-text">
          <span class="community-stats-value">{{ community_stats.visible_businesses }}</span>
          <span class="community-stats-label">کسب‌وکار ثبت شده</span>
        </span>
      </li>
      <li class="community-stats-item">
        <span class="community-stats-icon" aria-hidden="true">
          <i class="bi bi-link-45deg"></i>
        </span>
        <span class="community-stats-text">
          <span class="community-stats-value">{{ community_stats.useful_links }}</span>
          <span class="community-stats-label">لینک مفید</span>
        </span>
      </li>
      <li class="community-stats-item">
        <span class="community-stats-icon" aria-hidden="true">
          <i class="bi bi-calendar-event"></i>
        </span>
        <span class="community-stats-text">
          <span class="community-stats-value">{{ community_stats.published_events }}</span>
          <span class="community-stats-label">رویداد ثبت شده</span>
        </span>
      </li>
    </ul>
  </div>
</section>
{% endif %}
