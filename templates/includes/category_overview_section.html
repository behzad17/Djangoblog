{% if category_overview_rows %}
<div class="category-overview-section d-none d-md-block">
  <div class="category-overview-desktop-tablet">
      <div class="category-overview-posts">
        <section class="category-overview-latest-posts-box" aria-labelledby="category-latest-posts-heading">
          <h3 class="category-overview-latest-posts-title" id="category-latest-posts-heading">آخرین پستها</h3>
          <ul class="category-overview-title-list">
            {% for category, latest_post in category_overview_rows %}
              {% if latest_post %}
                <li class="category-overview-title-list__item">
                  <a href="{% url 'post_detail' latest_post.slug %}" class="category-overview-title-list__link" title="{{ latest_post.title }}"><i class="far fa-file-alt category-overview-title-list__icon d-none d-md-inline-flex" aria-hidden="true"></i><span class="category-overview-title-list__text">{{ latest_post.title }}</span></a>
                </li>
              {% endif %}
            {% endfor %}
          </ul>
        </section>
        {% include 'includes/mobile_homepage_banners.html' %}
      </div>
  </div>
</div>
{% endif %}
