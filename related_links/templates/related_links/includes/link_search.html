<div class="card mb-4 shadow-sm">
  <div class="card-body">
    <form action="{% url 'related_links:links_list' %}" method="get" role="search" aria-label="جست‌وجوی لینک‌های مفید">
      <div class="row g-3 align-items-end">
        <div class="col-md-4">
          <label for="useful-link-q" class="form-label">جست‌وجوی لینک‌های مفید</label>
          <input id="useful-link-q" type="search" name="q" value="{{ search_query }}" maxlength="200"
          class="form-control" placeholder="موضوع">
        </div>
        <div class="col-md-4">
          <label for="useful-link-category" class="form-label">دسته‌بندی</label>
          <select id="useful-link-category" name="category" class="form-select">
            <option value="">همهٔ دسته‌ها</option>
            {% for category in categories %}
            <option value="{{ category.slug }}"{% if category.pk == active_category.pk %} selected{% endif %}>{{ category.name_fa }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <button type="submit" class="btn btn-primary w-100">
            <i class="fas fa-search ms-2" aria-hidden="true"></i>جست‌وجو
          </button>
        </div>
      </div>
      {% if search_query %}
      <a class="btn btn-outline-secondary mt-3" href="{% url 'related_links:links_list' %}{% if active_category %}?category={{ active_category.slug }}{% endif %}">پاک کردن جست‌وجو</a>
      {% endif %}
    </form>
  </div>
</div>
